<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bon d'entrée - Système de Gestion de Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin: 20px;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 3px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border: 3px solid #4CAF50;
            border-radius: 15px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.2);
            transition: all 0.4s ease;
        }

        .logo:hover {
            transform: translateY(-5px) rotate(5deg);
            box-shadow: 0 12px 35px rgba(76, 175, 80, 0.3);
        }

        .logo img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            border-radius: 10px;
        }

        .bon-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .bon-table td {
            padding: 15px 20px;
            border: 1px solid #e0e0e0;
        }

        .bon-table td:first-child {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bon-table input {
            width: 100%;
            border: 2px solid #e0e0e0;
            background: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .bon-table input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
            outline: none;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .items-table th {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 18px 15px;
            border: 1px solid #45a049;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .items-table td {
            padding: 15px 12px;
            border: 1px solid #e0e0e0;
            background: #fafafa;
            vertical-align: middle;
        }

        .items-table tr:hover td {
            background: #f0f8f0;
            transition: background 0.3s ease;
        }

        .items-table input {
            width: 100%;
            border: 2px solid #e0e0e0;
            background: white;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .items-table input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
            outline: none;
        }

        .items-table input[readonly] {
            background-color: #f8f9fa;
            color: #6c757d;
            cursor: not-allowed;
            font-weight: bold;
        }

        .btn {
            border-radius: 10px;
            padding: 12px 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
            background: linear-gradient(135deg, #45a049, #4CAF50);
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            padding: 8px 15px;
            font-size: 12px;
        }

        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
        }

        .actions-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0;
            padding: 20px;
            background: linear-gradient(145deg, #f8f9fa, #ffffff);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .navigation-buttons {
            display: flex;
            gap: 10px;
        }

        .main-actions {
            display: flex;
            gap: 15px;
        }

        .signature-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .signature-table {
            width: 100%;
            border-collapse: collapse;
        }

        .signature-table td {
            padding: 20px;
            border: 1px solid #e0e0e0;
            text-align: center;
            background: #fafafa;
        }

        .signature-table strong {
            color: #4CAF50;
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: block;
        }

        .signature-box {
            height: 120px;
            border: 3px dashed #4CAF50;
            border-radius: 10px;
            margin: 15px 0;
            background: linear-gradient(145deg, #f8f9fa, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-style: italic;
            transition: all 0.3s ease;
        }

        .signature-box:hover {
            border-color: #45a049;
            background: linear-gradient(145deg, #f0f8f0, #ffffff);
        }

        .observations-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .observations-section textarea {
            width: 100%;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .observations-section textarea:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
            outline: none;
        }

        @media print {
            body {
                background: white;
            }
            .main-container {
                box-shadow: none;
                margin: 0;
                padding: 20px;
            }
            .actions-section {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                margin: 10px;
                padding: 20px;
            }
            .header h1 {
                font-size: 2rem;
            }
            .actions-section {
                flex-direction: column;
                gap: 15px;
            }
            .navigation-buttons, .main-actions {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <img src="protection-civile-marocaine-seeklogo.png" alt="Protection Civile Marocaine">
            </div>
            <h1>BON D'ENTRÉE</h1>
        </div>

        <!-- Navigation and Actions -->
        <div class="actions-section">
            <div class="navigation-buttons">
                <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </button>
                <button class="btn btn-secondary" onclick="window.location.href='inventory.html'">
                    <i class="fas fa-boxes me-2"></i>Inventaire
                </button>
                <button class="btn btn-secondary" onclick="window.history.back()">
                    <i class="fas fa-arrow-left me-2"></i>Retour
                </button>
            </div>
            <div class="main-actions">
                <button class="btn btn-success admin-only" onclick="addRow()">
                    <i class="fas fa-plus me-2"></i>Ajouter une ligne
                </button>
                <button class="btn btn-primary admin-only" onclick="saveData()">
                    <i class="fas fa-save me-2"></i>Enregistrer
                </button>
                <button class="btn btn-secondary" onclick="window.print()">
                    <i class="fas fa-print me-2"></i>Imprimer
                </button>
            </div>
        </div>

        <!-- Bon d'entrée Information -->
        <table class="bon-table">
            <tr>
                <td>BON D'ENTRÉE N°</td>
                <td><input type="text" id="bonNumber" style="text-align: center;"></td>
                <td>Date</td>
                <td><input type="date" id="bonDate" style="text-align: center;"></td>
            </tr>
            <tr>
                <td>Service</td>
                <td><input type="text" id="service" style="text-transform: uppercase;"></td>
                <td>Demandeur</td>
                <td><input type="text" id="demandeur" style="text-transform: uppercase;"></td>
            </tr>
        </table>

        <!-- Items Table -->
        <table class="items-table">
            <thead>
                <tr>
                    <th>Réf.message</th>
                    <th>Article</th>
                    <th>Description</th>
                    <th>Quantité</th>
                    <th>Prix Unitaire</th>
                    <th>Total</th>
                    <th class="no-print">Actions</th>
                </tr>
            </thead>
            <tbody id="itemsTable">
                <tr>
                    <td><input type="text" readonly value="001"></td>
                    <td><input type="text" placeholder="Entrez le nom de l'article" required></td>
                    <td><input type="text" placeholder="Description"></td>
                    <td><input type="number" placeholder="0" required></td>
                    <td><input type="text" placeholder="Nom du donnant" required></td>
                    <td><input type="text" placeholder="Nom du magasinier"></td>
                    <td>
                        <button class="btn btn-danger" onclick="removeRow(this)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Observations -->
        <div class="observations-section">
            <h4 style="color: #4CAF50; margin-bottom: 15px;">
                <i class="fas fa-comment me-2"></i>Observations
            </h4>
            <textarea rows="4" placeholder="Observations..."></textarea>
        </div>

        <!-- Signatures -->
        <div class="signature-section">
            <table class="signature-table">
                <tr>
                    <td>
                        <strong>Signature Fournisseur</strong>
                        <div class="signature-box">
                            <i class="fas fa-signature fa-2x"></i>
                        </div>
                        <div>
                            <p class="mb-1"><strong>Nom et qualité:</strong></p>
                            <input type="text" class="form-control" id="fournisseurNomQualite" placeholder="Nom et qualité du fournisseur">
                        </div>
                    </td>
                    <td>
                        <strong>Signature Magasinier</strong>
                        <div class="signature-box">
                            <i class="fas fa-signature fa-2x"></i>
                        </div>
                        <div>
                            <p class="mb-1"><strong>Nom et qualité:</strong></p>
                            <input type="text" class="form-control" id="magasinierNomQualite" placeholder="Nom et qualité du magasinier">
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Stock In Enhanced loaded');
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('bonDate').value = today;
            generateBonNumber();
            
            // تطبيق نظام الصلاحيات
            applyUserPermissions();
        });

        function generateBonNumber() {
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            const bonNumber = `BE-${year}${month}${day}-${random}`;
            document.getElementById('bonNumber').value = bonNumber;
        }

        function addRow() {
            const tbody = document.getElementById('itemsTable');
            const newRow = document.createElement('tr');
            const rowNumber = tbody.children.length + 1;
            newRow.innerHTML = `
                <td><input type="text" readonly value="${String(rowNumber).padStart(3, '0')}"></td>
                <td><input type="text" placeholder="Entrez le nom de l'article" required></td>
                <td><input type="text" placeholder="Description"></td>
                <td><input type="number" placeholder="0" required></td>
                <td><input type="text" placeholder="Nom du donnant" required></td>
                <td><input type="text" placeholder="Nom du magasinier"></td>
                <td>
                    <button class="btn btn-danger" onclick="removeRow(this)">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(newRow);
        }
        
        function removeRow(button) {
            const row = button.closest('tr');
            const tbody = row.parentNode;
            
            if (tbody.children.length > 1) {
                tbody.removeChild(row);
                // Renumber rows
                const rows = tbody.querySelectorAll('tr');
                rows.forEach((row, index) => {
                    const codeInput = row.querySelector('td:first-child input');
                    if (codeInput) {
                        codeInput.value = String(index + 1).padStart(3, '0');
                    }
                });
            } else {
                alert('Impossible de supprimer la dernière ligne. Au moins une ligne doit rester.');
            }
        }
        
        function saveData() {
            const formData = {
                bonNumber: document.getElementById('bonNumber').value,
                date: document.getElementById('bonDate').value,
                service: document.getElementById('service').value,
                demandeur: document.getElementById('demandeur').value,
                items: []
            };
            
            // Get items data
            const tbody = document.getElementById('itemsTable');
            const rows = tbody.querySelectorAll('tr');
            
            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                if (inputs.length >= 6) {
                    formData.items.push({
                        code: inputs[0].value,
                        article: inputs[1].value,
                        description: inputs[2].value,
                        quantite: inputs[3].value,
                        donnant: inputs[4].value,
                        magasinier: inputs[5].value
                    });
                }
            });
            
            console.log('Data saved:', formData);
            alert('Données sauvegardées avec succès!');
        }

        // دالة لتطبيق نظام الصلاحيات
        function applyUserPermissions() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            const isAdmin = currentUser.role === 'Administrateur';
            
            // إخفاء/إظهار عناصر حسب الصلاحيات
            const adminOnlyElements = document.querySelectorAll('.admin-only');
            
            adminOnlyElements.forEach(element => {
                element.style.display = isAdmin ? 'inline-block' : 'none';
            });

            // إذا كان المستخدم عادي، جعل الحقول للقراءة فقط
            if (!isAdmin) {
                const inputs = document.querySelectorAll('input, textarea');
                inputs.forEach(input => {
                    input.readOnly = true;
                    input.disabled = true;
                });
                
                // إخفاء أزرار الحذف
                const deleteButtons = document.querySelectorAll('.btn-danger');
                deleteButtons.forEach(button => {
                    button.style.display = 'none';
                });
            }
        }
    </script>
</body>
</html>
