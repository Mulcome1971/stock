<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bon de Sortie - Système de Gestion de Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin: 20px;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 3px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border: 3px solid #4CAF50;
            border-radius: 15px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.2);
            transition: all 0.4s ease;
        }

        .logo:hover {
            transform: translateY(-5px) rotate(5deg);
            box-shadow: 0 12px 35px rgba(76, 175, 80, 0.3);
        }

        .logo img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            border-radius: 10px;
        }

        .bon-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .bon-table td {
            padding: 15px 20px;
            border: 1px solid #e0e0e0;
        }

        .bon-table td:first-child {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bon-table input {
            width: 100%;
            border: 2px solid #e0e0e0;
            background: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .bon-table input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
            outline: none;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .items-table th {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 18px 15px;
            border: 1px solid #45a049;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .items-table td {
            padding: 15px 12px;
            border: 1px solid #e0e0e0;
            background: #fafafa;
            vertical-align: middle;
        }

        .items-table tr:hover td {
            background: #f0f8f0;
            transition: background 0.3s ease;
        }

        .items-table input {
            width: 100%;
            border: 2px solid #e0e0e0;
            background: white;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .items-table input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
            outline: none;
        }

        .items-table input[readonly] {
            background-color: #f8f9fa;
            color: #6c757d;
            cursor: not-allowed;
            font-weight: bold;
        }

        .btn {
            border-radius: 10px;
            padding: 12px 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
            background: linear-gradient(135deg, #45a049, #4CAF50);
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
        }

        .signature-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin: 30px 0;
        }

        .signature-box {
            background: white;
            border: 2px dashed #4CAF50;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .signature-box h5 {
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .signature-line {
            border-top: 2px solid #4CAF50;
            margin-top: 50px;
            padding-top: 10px;
            font-weight: bold;
            color: #4CAF50;
        }

        .observations-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .observations-section h3 {
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .observations-section textarea {
            width: 100%;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            font-size: 14px;
            transition: all 0.3s ease;
            resize: vertical;
        }

        .observations-section textarea:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
            outline: none;
        }

        .actions-section {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .no-print {
            display: table-cell;
        }

        @media print {
            body {
                background: white;
            }
            
            .main-container {
                box-shadow: none;
                margin: 0;
                padding: 20px;
            }
            
            .no-print {
                display: none !important;
            }
            
            .header {
                background: #4CAF50 !important;
                color: white !important;
            }
            
            .btn {
                display: none !important;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                margin: 10px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .signature-section {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .bon-table, .items-table {
                font-size: 0.9rem;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }

        .alert {
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .alert-success {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }

        .alert-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <div class="logo">
                <img src="protection-civile-marocaine-seeklogo.png" alt="Protection Civile Marocaine">
            </div>
            <h1><i class="fas fa-arrow-right-from-bracket"></i> BON DE SORTIE</h1>
            <p>ROYAUME DU MAROC - MINISTERE DE L'INTERIEUR - DIRECTION DE LA PROTECTION CIVILE</p>
        </div>

        <form id="bonSortieForm">
            <!-- Informations Générales -->
            <table class="bon-table">
                <tr>
                    <td>Numéro du Bon</td>
                    <td><input type="text" id="bonNumber"></td>
                    <td>Date</td>
                    <td><input type="date" id="bonDate" required></td>
                </tr>
                <tr>
                    <td>Service</td>
                    <td><input type="text" id="service" placeholder="Nom du service" required></td>
                    <td>Demandeur</td>
                    <td><input type="text" id="demandeur" placeholder="Nom du demandeur" required></td>
                </tr>
            </table>

            <!-- Table des Articles -->
            <table class="items-table">
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>Article</th>
                        <th>Description</th>
                        <th>Quantité</th>
                        <th>Demandeur</th>
                        <th>Magasinier</th>
                        <th class="no-print">Actions</th>
                    </tr>
                </thead>
                <tbody id="itemsTable">
                    <tr>
                        <td><input type="text" readonly></td>
                        <td><input type="text" placeholder="Entrez le nom de l'article" required></td>
                        <td><input type="text"></td>
                        <td><input type="number" class="quantity" required></td>
                        <td><input type="text" class="demandeur-field" required></td>
                        <td><input type="text" class="magasinier-field"></td>
                        <td class="no-print">
                            <button type="button" class="btn btn-danger btn-sm" onclick="removeRow(this)">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="text-center no-print">
                <button type="button" class="btn btn-primary" onclick="addItem()">
                    <i class="fas fa-plus"></i> Ajouter un article
                </button>
            </div>

            <!-- Observations -->
            <div class="observations-section">
                <h3><i class="fas fa-comment"></i> Observations</h3>
                <textarea rows="4" placeholder="Observations ou remarques..."></textarea>
            </div>

            <!-- Signatures -->
            <div class="signature-section">
                <div class="signature-box">
                    <h5>Demandeur</h5>
                    <input type="text" class="form-control" id="demandeurNomQualite" placeholder="Nom et qualité du demandeur">
                    <div class="signature-line">Signature</div>
                </div>
                <div class="signature-box">
                    <h5>Magasinier</h5>
                    <input type="text" class="form-control" id="magasinierNomQualite" placeholder="Nom et qualité du magasinier">
                    <div class="signature-line">Signature</div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions-section no-print">
                <button type="submit" class="btn btn-success me-3">
                    <i class="fas fa-save"></i> Enregistrer
                </button>
                <button type="button" class="btn btn-primary me-3" onclick="printBonSortie()">
                    <i class="fas fa-print"></i> Imprimer
                </button>
                <button type="button" class="btn btn-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/stock-out.js"></script>
</body>
</html>
